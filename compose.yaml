services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: mip
      POSTGRES_PASSWORD: mip
      POSTGRES_DB: mip
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mip"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
